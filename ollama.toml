# >>> grok-ollama (managed by ollama.sh — do not edit inside) >>>
#
# Local models served by Ollama at http://localhost:11434
# Regenerate with:  ./ollama.sh generate
#
# Only tool-capable models are listed — Grok needs tool calling to edit
# files and run commands. context_window is what Ollama actually serves
# (32K), not what the model advertises, so auto-compaction fires before
# the real window overflows.

[models]
default = "gemma4"

[model.gemma4]
model = "grok-gemma4-12b-32k"
